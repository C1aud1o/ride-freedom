name: App Android (APK)

on:
  push:
    branches: [main, ccr-28a29a79-yshigo, 'spindro/**']
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vendor/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web && npx cap sync android
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Prepara la chiave di release (dai Secret GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spindro-release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/spindro-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SPINDRO_SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "Chiave di release trovata: build RELEASE firmata (APK foss + AAB play)."
          else
            echo "SPINDRO_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning title=APK debug (fallback)::Secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD mancanti: compilo l'APK DEBUG come prima, niente AAB. Vedi docs/android-release.md"
          fi
      - name: Cache di Gradle (distribuzione e dipendenze)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Scarica Gradle (con nuovi tentativi se il server è lento)
        working-directory: android
        run: |
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && exit 0; echo "tentativo $i fallito, riprovo"; sleep $((i * 30)); done
          echo "::error::Impossibile scaricare Gradle (server di distribuzione non raggiungibile)"; exit 1
      - name: Compila (release firmata, oppure debug se mancano i Secret)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$SPINDRO_SIGNED" = "true" ]; then
            ./gradlew assembleFossRelease bundlePlayRelease --no-daemon
            cp app/build/outputs/apk/foss/release/app-foss-release.apk ../spindro.apk
            cp app/build/outputs/bundle/playRelease/app-play-release.aab ../spindro-play.aab
          else
            ./gradlew assembleFossDebug --no-daemon
            cp app/build/outputs/apk/foss/debug/app-foss-debug.apk ../spindro.apk
          fi
          echo "Build ${VERSION_CODE} (versionName 1.0.${VERSION_CODE}), firmata release: $SPINDRO_SIGNED" >> "$GITHUB_STEP_SUMMARY"
      - name: Elimina la chiave dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/spindro-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: spindro-apk
          path: spindro.apk
      # l'AAB serve solo per caricarlo a mano su Google Play: resta artifact della run, NON va nella release pubblica
      - uses: actions/upload-artifact@v4
        if: env.SPINDRO_SIGNED == 'true'
        with:
          name: spindro-play-aab
          path: spindro-play.aab
          if-no-files-found: error
      # i branch di lavoro (spindro/**) compilano soltanto: la release pubblica si aggiorna da main e dal branch storico
      - name: Pubblica l'APK nella release "app-android"
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-28a29a79-yshigo'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: Spindro per Android
          make_latest: true
          files: spindro.apk
          body: |
            App Android di Spindro (build ${{ github.run_number }}).
            Apri questa pagina dal telefono, scarica **spindro.apk** e installalo
            (Android chiederà di consentire l'installazione da questa fonte).
            Novità dell'app: Bluetooth nativo e ponte verso Garmin (il telefono diventa un sensore di potenza, cadenza e velocità).
