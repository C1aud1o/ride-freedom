name: Regole Firestore e Cloud Functions

on:
  push:
    paths:
      - 'firebase/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/rules.yml'
  pull_request:
    paths:
      - 'firebase/**'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regole:
    name: Test delle regole (emulatore Firestore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # l'emulatore Firestore è un .jar
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npm test

  functions:
    name: Cloud Functions (compilazione e test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
